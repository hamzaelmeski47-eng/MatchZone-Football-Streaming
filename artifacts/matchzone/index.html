<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>MatchZone | بث مباشر لمباريات اليوم</title>
    <meta name="description" content="MatchZone - منصة البث المباشر لمباريات كرة القدم، نتائج حية، تشكيلات الفرق، وجدول مواعيد المباريات لجميع البطولات الكبرى." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="MatchZone | بث مباشر لمباريات اليوم" />
    <meta property="og:description" content="شاهد مباريات كرة القدم مباشرة بجودة عالية وبدون تقطيع." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Default to Dark Mode immediately before rendering
      (function() {
        try {
          var userSet = localStorage.getItem('matchzone_theme_explicit');
          var theme = (userSet === 'true' && localStorage.getItem('matchzone_theme')) ? localStorage.getItem('matchzone_theme') : 'dark';
          var doc = document.documentElement;
          if (theme === 'light') {
            doc.classList.add('light');
            doc.classList.remove('dark');
            doc.setAttribute('data-theme', 'light');
          } else {
            doc.classList.add('dark');
            doc.classList.remove('light');
            doc.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
